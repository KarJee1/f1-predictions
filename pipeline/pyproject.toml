[project]
name = "f1pred"
version = "0.1.0"
description = "Data pipeline and race prediction model for the F1 Predictions app"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "requests>=2.31",
  "xgboost>=2.1",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "fastf1>=3.4",
  "feedparser>=6.0",
  "google-cloud-storage>=2.16",
  "google-cloud-firestore>=2.19",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
f1pred = "f1pred.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["f1pred*"]
